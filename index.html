<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Slide to PPTX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

    <header class="h-16 border-b border-white/10 flex items-center justify-between px-6 bg-slate-900/80 backdrop-blur-md z-50">
        <div class="flex items-center gap-2 font-bold text-lg">
            <span class="text-blue-500 text-2xl">⚡</span> PDF Slide to PPTX
        </div>
        <button id="exportBtn" class="hidden bg-blue-600 hover:bg-blue-500 px-8 py-2 rounded-lg font-bold transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
            PPTX出力
        </button>
    </header>

    <main id="dropZone" class="flex-1 flex flex-col items-center justify-center relative transition-colors overflow-hidden">
        
        <div id="uploadUI" class="text-center p-10 bg-slate-900/50 rounded-3xl border border-white/10 backdrop-blur-md shadow-2xl max-w-md z-10">
            <div class="mb-6 mx-auto w-20 h-20 bg-blue-600/20 rounded-full flex items-center justify-center">
                <span class="text-4xl text-blue-400">📄</span>
            </div>
            <h1 class="text-3xl font-bold mb-2 text-white">PDF Slide to PPTX</h1>
            <p class="text-slate-400 mb-8">PDFを読み込んでパワポに変換します。<br>ブラウザ内処理で安全・高速です。</p>
            <input type="file" id="fileInput" accept=".pdf" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" id="selectBtn" class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-lg flex items-center justify-center gap-3 transition-all active:scale-95">
                ファイルを選択
            </button>
            <div id="loader" class="hidden mt-4 text-blue-400 font-bold items-center justify-center gap-2">
                <span class="loading-spin block w-5 h-5 border-2 border-blue-400 border-t-transparent rounded-full"></span>
                PDF解析中...
            </div>
        </div>

        <div id="editorUI" class="hidden w-full h-full flex overflow-hidden bg-slate-950">
            <div id="sidebar" class="w-56 border-r border-white/10 overflow-y-auto p-4 bg-slate-900/30 space-y-4 shadow-xl"></div>
            <div class="flex-1 flex flex-col relative">
                <div class="flex-1 p-8 flex items-center justify-center overflow-hidden bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-900 to-slate-950">
                    <img id="mainPreview" class="max-h-full shadow-2xl border border-white/5 rounded-sm transition-opacity duration-300">
                </div>
                <div class="h-56 bg-slate-900/80 border-t border-white/10 p-5 backdrop-blur-md">
                    <div class="flex items-center gap-2 text-xs font-bold text-blue-400 mb-3 tracking-widest uppercase">
                        <span>📝 スライドノート (パワポのノート欄に反映)</span>
                    </div>
                    <textarea id="noteArea" class="w-full h-32 bg-slate-800/50 p-4 rounded-xl text-sm outline-none focus:ring-2 ring-blue-500/50 transition-all resize-none shadow-inner" placeholder="このスライドに関するメモや説明文を入力してください..."></textarea>
                </div>
            </div>
        </div>
    </main>

    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let slidesData = [];
        let activeIndex = 0;

        const fileInput = document.getElementById('fileInput');
        const uploadUI = document.getElementById('uploadUI');
        const editorUI = document.getElementById('editorUI');
        const sidebar = document.getElementById('sidebar');
        const mainPreview = document.getElementById('mainPreview');
        const noteArea = document.getElementById('noteArea');
        const exportBtn = document.getElementById('exportBtn');
        const loader = document.getElementById('loader');

        fileInput.addEventListener('change', handleFile);

        async function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            loader.classList.replace('hidden', 'flex');
            document.getElementById('selectBtn').classList.add('hidden');
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                slidesData = [];
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getPageViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await page.render({ canvasContext: context, viewport }).promise;
                    slidesData.push({ image: canvas.toDataURL('image/png'), note: "" });
                }
                renderEditor();
            } catch (err) {
                alert("エラー: " + err.message);
                location.reload();
            }
        }

        function renderEditor() {
            uploadUI.classList.add('hidden');
            editorUI.classList.remove('hidden');
            exportBtn.classList.remove('hidden');
            sidebar.innerHTML = '';
            slidesData.forEach((s, i) => {
                const thumb = document.createElement('div');
                thumb.className = `group relative cursor-pointer rounded-lg overflow-hidden border-2 transition-all duration-200 shadow-md ${i === activeIndex ? 'border-blue-500 scale-[1.02] shadow-blue-500/20' : 'border-transparent opacity-60 hover:opacity-100'}`;
                thumb.innerHTML = `<img src="${s.image}" class="w-full"><div class="absolute bottom-1 right-2 text-[10px] font-bold text-white drop-shadow-md">P${i+1}</div>`;
                thumb.onclick = () => switchSlide(i);
                sidebar.appendChild(thumb);
            });
            mainPreview.src = slidesData[activeIndex].image;
            noteArea.value = slidesData[activeIndex].note;
        }

        function switchSlide(index) {
            slidesData[activeIndex].note = noteArea.value;
            activeIndex = index;
            renderEditor();
        }

        noteArea.oninput = () => { slidesData[activeIndex].note = noteArea.value; };

        exportBtn.onclick = async () => {
            if (!window.PptxGenJS || slidesData.length === 0) return;
            const originalText = exportBtn.innerText;
            exportBtn.innerText = "ダウンロード中...";
            exportBtn.disabled = true;
            const originalClass = exportBtn.className;
            exportBtn.classList.add('bg-slate-700', 'cursor-not-allowed');
            try {
                slidesData[activeIndex].note = noteArea.value;
                const pptx = new PptxGenJS();
                slidesData.forEach((s) => {
                    const slide = pptx.addSlide();
                    slide.addImage({ data: s.image, x: 0, y: 0, w: '100%', h: '100%' });
                    if (s.note && s.note.trim() !== "") { slide.addNotes(s.note); }
                });
                await pptx.writeFile({ fileName: `slides_${Date.now()}.pptx` });
            } catch (err) {
                console.error(err);
                alert("PPTX生成中にエラーが発生しました: " + err.message);
            } finally {
                exportBtn.innerText = originalText;
                exportBtn.disabled = false;
                exportBtn.className = originalClass;
            }
        };
    </script>
</body>
</html>
